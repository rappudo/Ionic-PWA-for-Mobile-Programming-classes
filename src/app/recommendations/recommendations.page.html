<ion-header [translucent]="true">
  <ion-toolbar class="md-glass-toolbar">
    <ion-title>Descobrir</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="refresh()" aria-label="Recarregar" [disabled]="refreshing()">
        <ion-icon
          slot="icon-only"
          name="refresh-outline"
          [class.is-spinning]="refreshing()"
        />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="recs-content">
  <ion-refresher slot="fixed" (ionRefresh)="onRefresh($event)">
    <ion-refresher-content />
  </ion-refresher>

  @if (loading()) {
    <div class="recs-skeleton">
      <div class="daily-card--sk"></div>
      <app-skeleton-grid [count]="6" />
    </div>
  } @else {
    @if (dailyPick(); as anime) {
      <app-hero-banner [anime]="anime" (select)="openAnime($event)" />
    }

    <a class="surprise-cta" routerLink="/surprise">
      <div class="surprise-cta__icon">
        <ion-icon name="dice-outline" aria-hidden="true" />
      </div>
      <div class="surprise-cta__body">
        <span class="surprise-cta__title">Não sabe o que assistir?</span>
        <span class="surprise-cta__sub">Sortear um anime aleatório com filtros</span>
      </div>
      <ion-icon class="surprise-cta__arrow" name="chevron-forward-outline" aria-hidden="true" />
    </a>

    <app-media-rail
      eyebrow="Bombando"
      title="Em alta na semana"
      [animes]="trendingAnimes()"
      (select)="openAnime($event)"
    />

    <app-media-rail
      eyebrow="Sob medida"
      title="Pra você"
      [animes]="personalRecs()"
      (select)="openAnime($event)"
    />

    <app-media-rail
      eyebrow="Curadoria dos amigos"
      title="Dos seus amigos"
      [animes]="friendRecAnimes()"
      (select)="openAnime($event)"
    />

    @if (showOnboardingHint()) {
      <div class="hint md-reveal">
        <ion-icon name="sparkles-outline" aria-hidden="true" />
        <p class="hint__text">
          Avalie animes com nota <strong>7+</strong>, marque favoritos e adicione amigos —
          quanto mais você usar, mais certeiras ficam as recomendações aqui.
        </p>
      </div>
    }
  }
</ion-content>
